name: udmabuf-import-dkms

# Build the experimental udmabuf_import DKMS deb and make it available as a
# prerequisite. On a PR touching the module it builds the deb, installs it, and
# builds a upcie consumer against it. On a upcie release tag (v*) it also
# attaches the deb -- at its own version, from experimental/udmabuf_import/
# debian/ -- to the upcie GitHub Release. The module is not released on its own;
# it rides the upcie release as an asset.
#
# NOTE: PR builds are path-filtered. Pushes -- to main (post-merge) and to v*
# tags (release) -- carry no paths filter, because a paths filter on push would
# suppress the tag trigger (paths and tags do not combine cleanly); a push to
# main therefore runs regardless of what changed.

on:
  pull_request:
    paths:
      - 'experimental/udmabuf_import/**'
      - '.github/workflows/udmabuf-import-dkms.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # First step: build the deb once and upload it.
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packaging toolchain
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev git ca-certificates
          apt-get install -y dh-dkms || apt-get install -y dkms

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build the DKMS .deb
        working-directory: experimental/udmabuf_import
        run: dpkg-buildpackage -us -uc -b

      - name: Upload the deb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: udmabuf-import-dkms
          path: experimental/udmabuf-import-dkms_*_all.deb
          if-no-files-found: error

  # Prerequisite made available: download the deb and install it on each
  # supported release, then build a upcie consumer against the installed
  # <linux/udmabuf_import.h> to prove the dma-buf path builds.
  install:
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Prerequisites
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential kmod dkms linux-headers-generic

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download the deb
        uses: actions/download-artifact@v8.0.1
        with:
          name: udmabuf-import-dkms
          path: dl

      - name: Install the deb (prerequisite)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          deb=$(ls dl/udmabuf-import-dkms_*_all.deb)
          apt-get install -y "./$deb"
          test -f /usr/include/linux/udmabuf_import.h && echo "header installed"
          dkms status | grep udmabuf-import

      - name: Build a upcie consumer against the prerequisite
        run: |
          cat > consumer.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <errno.h>
          #include <fcntl.h>
          #include <sys/ioctl.h>
          #include <unistd.h>
          #include <inttypes.h>
          #define UPCIE_DEBUG(...) do { } while (0)
          #include <upcie/dmabuf.h>
          int main(void) { struct dmabuf d; (void)d; (void)UDMABUF_IMPORT_DEVPATH; return 0; }
          EOF
          gcc -Wall -Iinclude -o consumer consumer.c
          echo "upcie dma-buf consumer builds against the installed prerequisite"

  # Independent out-of-tree link check (modpost); needs no deb.
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Install kernel headers and toolchain
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential kmod linux-headers-generic

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build the module (out-of-tree link check)
        working-directory: experimental/udmabuf_import
        run: |
          hdr=$(ls -d /usr/src/linux-headers-*-generic | head -1)
          make -C module KDIR="$hdr"
          test -f module/udmabuf_import.ko
          modinfo module/udmabuf_import.ko | grep -E 'name|vermagic|import_ns|depends'

  # On a upcie release tag (v*), attach the built deb to the upcie Release as an
  # asset. The deb keeps its own version; it does not get its own release.
  release:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the deb
        uses: actions/download-artifact@v8.0.1
        with:
          name: udmabuf-import-dkms
          path: dl

      - name: Attach the deb to the upcie release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          deb=$(ls dl/udmabuf-import-dkms_*_all.deb)
          # The upcie Release is normally created by the upcie release process;
          # create it if it does not exist yet, then attach the deb.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" "$deb" --repo "$GITHUB_REPOSITORY" --clobber
