name: dmabuf-import-dkms

# Build the experimental dmabuf_import DKMS deb and make it available as a
# prerequisite. On a PR touching the module it builds the deb, installs it, and
# builds a upcie consumer against it. On a upcie release tag (v*) it also
# attaches the deb, at its own version, from experimental/dmabuf_import/
# debian/, to the upcie GitHub Release. The module is not released on its own;
# it rides the upcie release as an asset.
#
# NOTE: PR builds are path-filtered. Pushes, to main (post-merge) and to v*
# tags (release), carry no paths filter, because a paths filter on push would
# suppress the tag trigger (paths and tags do not combine cleanly); a push to
# main therefore runs regardless of what changed.

on:
  pull_request:
    paths:
      - 'experimental/dmabuf_import/**'
      - '.github/workflows/dmabuf-import-dkms.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# Steps run inside containers, where the runner falls back to /bin/sh when it
# cannot resolve bash. dash has no `pipefail`, so pin bash for every step.
defaults:
  run:
    shell: bash

jobs:
  # First step: build the deb once and upload it.
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packaging toolchain
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev git ca-certificates
          apt-get install -y dh-dkms || apt-get install -y dkms

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build the DKMS .deb
        working-directory: experimental/dmabuf_import
        run: dpkg-buildpackage -us -uc -b

      - name: Upload the deb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dmabuf-import-dkms
          path: experimental/dmabuf-import-dkms_*_all.deb
          if-no-files-found: error

  # Prerequisite made available: download the deb and install it on each
  # supported release, then build a upcie consumer against the installed
  # <linux/dmabuf_import.h> to prove the dma-buf path builds.
  install:
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Prerequisites
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential kmod dkms linux-headers-generic git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download the deb
        uses: actions/download-artifact@v8.0.1
        with:
          name: dmabuf-import-dkms
          path: dl

      - name: Build the consumer on the stub path (before installing)
        run: |
          # Without the module UAPI the import helpers must still compile, as
          # -ENOTSUP stubs. verify.yml compiles that path incidentally; nothing
          # asserts it, and it only exists until the deb lands, so assert it
          # here, before installing.
          cat > stub.c <<'EOF'
          #include <upcie/upcie.h>
          int main(void)
          {
                  struct dmabuf d = {0};
          #if UPCIE_HAVE_DMABUF_IMPORT
          #error "expected the stub path before installing the deb"
          #endif
                  return dmabuf_import_attach(3, &d) == -ENOTSUP ? 0 : 1;
          }
          EOF
          gcc -Wall -Wextra -Iinclude -o stub stub.c
          ./stub
          echo "stub path builds and returns ENOTSUP"

      - name: Install the deb (prerequisite)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          deb=$(ls dl/dmabuf-import-dkms_*_all.deb)
          apt-get install -y "./$deb"
          test -f /usr/include/linux/dmabuf_import.h
          # Checked in the deb, not on disk: the ubuntu container images set
          # path-exclude=/usr/share/doc/*, so docdir files never get unpacked
          # here even though they install fine on a real host.
          dpkg -c "$deb" | grep -q '60-dmabuf-import.rules.example'

          # `uname -r` in a container is the host kernel, so DKMS skips it and
          # targets the kernel whose headers this image ships. Build explicitly
          # rather than trusting `dkms status` alone, which also passes on the
          # "added" state where nothing was compiled. Mirrors the sibling
          # iommu-map-pa workflow.
          ver=$(dpkg-query -W -f='${Version}' dmabuf-import-dkms)
          kver=$(basename "$(ls -d /usr/src/linux-headers-*-generic | head -1)" \
                 | sed 's/^linux-headers-//')
          dkms build -m dmabuf-import -v "$ver" -k "$kver"
          dkms status -m dmabuf-import -v "$ver" -k "$kver" | grep -qE ': (built|installed)'

      - name: Build a upcie consumer against the prerequisite
        run: |
          cat > consumer.c <<'EOF'
          #include <upcie/upcie.h>
          int main(void)
          {
                  struct dmabuf d = {0};
                  (void)d;
                  (void)DMABUF_IMPORT_DEVPATH;
          #if !UPCIE_HAVE_DMABUF_IMPORT
          #error "the installed deb should have enabled the real import path"
          #endif
                  return 0;
          }
          EOF
          gcc -Wall -Wextra -Iinclude -o consumer consumer.c
          echo "upcie dma-buf consumer builds against the installed prerequisite"

  # Independent out-of-tree link check (modpost); needs no deb.
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Install kernel headers and toolchain
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential kmod linux-headers-generic

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build the module (out-of-tree link check)
        working-directory: experimental/dmabuf_import
        run: |
          hdr=$(ls -d /usr/src/linux-headers-*-generic | head -1)
          make -C module KDIR="$hdr"
          test -f module/dmabuf_import.ko
          modinfo module/dmabuf_import.ko | grep -E 'name|vermagic|import_ns|depends'

  # On a upcie release tag (v*), attach the built deb to the upcie Release as an
  # asset. The deb keeps its own version; it does not get its own release.
  release:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the deb
        uses: actions/download-artifact@v8.0.1
        with:
          name: dmabuf-import-dkms
          path: dl

      - name: Attach the deb to the upcie release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          deb=$(ls dl/dmabuf-import-dkms_*_all.deb)
          # The upcie Release is normally created by the upcie release process;
          # create it if it does not exist yet, then attach the deb.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" "$deb" --repo "$GITHUB_REPOSITORY" --clobber
