name: iommu-map-pa-dkms

# Build the experimental iommu_map_pa DKMS deb and make it available as a
# prerequisite. On a PR touching the module it builds the deb, installs it, and
# builds a upcie consumer against it. On a upcie release tag (v*) it also
# attaches the deb -- at its own version, from experimental/iommu_map_pa/
# debian/ -- to the upcie GitHub Release. The module is not released on its own;
# it rides the upcie release as an asset.
#
# NOTE: PR builds are path-filtered. Pushes -- to main (post-merge) and to v*
# tags (release) -- carry no paths filter, because a paths filter on push would
# suppress the tag trigger (paths and tags do not combine cleanly); a push to
# main therefore runs regardless of what changed.

on:
  pull_request:
    paths:
      - 'experimental/iommu_map_pa/**'
      - '.github/workflows/iommu-map-pa-dkms.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

# Steps run inside containers, where the runner falls back to /bin/sh when it
# cannot resolve bash. dash has no `pipefail`, so pin bash for every step.
defaults:
  run:
    shell: bash

jobs:
  # First step: build the deb once and upload it.
  build-deb:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Install packaging toolchain
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential debhelper fakeroot dpkg-dev git ca-certificates
          apt-get install -y dh-dkms || apt-get install -y dkms

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build the DKMS .deb
        working-directory: experimental/iommu_map_pa
        run: dpkg-buildpackage -us -uc -b

      - name: Upload the deb
        uses: actions/upload-artifact@v7.0.1
        with:
          name: iommu-map-pa-dkms
          path: experimental/iommu-map-pa-dkms_*_all.deb
          if-no-files-found: error

  # Prerequisite made available: download the deb and install it on each
  # supported release, then build a consumer against the installed headers to
  # prove the helper wrappers build from the package alone.
  install:
    needs: build-deb
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Prerequisites
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential kmod dkms linux-headers-generic git ca-certificates

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Download the deb
        uses: actions/download-artifact@v8.0.1
        with:
          name: iommu-map-pa-dkms
          path: dl

      - name: Install the deb (prerequisite)
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          deb=$(ls dl/iommu-map-pa-dkms_*_all.deb)
          apt-get install -y "./$deb"
          test -f /usr/include/linux/iommu_map_pa.h
          test -f /usr/include/upcie/experimental/iommu_map_pa.h
          test -f /usr/share/doc/iommu-map-pa-dkms/60-iommu-map-pa.rules.example

          # `uname -r` in a container is the host kernel, so DKMS skips it and
          # targets the kernel whose headers this image ships. That leaves the
          # module at "built" or "installed" depending on how far autoinstall
          # got, and either state proves the source package compiles.
          ver=$(dpkg-query -W -f='${Version}' iommu-map-pa-dkms)
          # head -1: with more than one match the glob would feed basename a
          # second argument, which it takes as a suffix to strip, not a path.
          kver=$(basename "$(ls -d /usr/src/linux-headers-*-generic | head -1)" \
                 | sed 's/^linux-headers-//')
          dkms build -m iommu-map-pa -v "$ver" -k "$kver"
          dkms status -m iommu-map-pa -v "$ver" -k "$kver" | grep -qE ': (built|installed)'

      - name: Build a consumer against the prerequisite
        run: |
          # Built outside the checkout and with no -I: everything must come from
          # what the deb installed, so a gap in the shipped surface fails here.
          cd /tmp
          cat > consumer.c <<'EOF'
          #include <stdint.h>
          #include <upcie/experimental/iommu_map_pa.h>
          int main(void)
          {
                  struct iommu_map_pa_req req = {0};
                  (void)req;
                  (void)IOMMU_MAP_PA_DEVPATH;
                  return upcie_iommu_map_pa_del(-1, 0) == -EINVAL ? 0 : 1;
          }
          EOF
          gcc -Wall -Wextra -o consumer consumer.c
          echo "helper wrappers build against the installed prerequisite"

  # Independent out-of-tree link check (modpost); needs no deb.
  module:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["24.04", "26.04"]
    container:
      image: ubuntu:${{ matrix.release }}
    steps:
      - name: Install kernel headers and toolchain
        run: |
          apt-get update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            build-essential kmod linux-headers-generic

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Build the module (out-of-tree link check)
        working-directory: experimental/iommu_map_pa
        run: |
          hdr=$(ls -d /usr/src/linux-headers-*-generic | head -1)
          make -C module KDIR="$hdr"
          test -f module/iommu_map_pa.ko
          modinfo module/iommu_map_pa.ko | grep -E 'name|vermagic|depends'

  # On a upcie release tag (v*), attach the built deb to the upcie Release as an
  # asset. The deb keeps its own version; it does not get its own release.
  release:
    needs: build-deb
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the deb
        uses: actions/download-artifact@v8.0.1
        with:
          name: iommu-map-pa-dkms
          path: dl

      - name: Attach the deb to the upcie release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          deb=$(ls dl/iommu-map-pa-dkms_*_all.deb)
          # The upcie Release is normally created by the upcie release process;
          # create it if it does not exist yet, then attach the deb.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes
          gh release upload "$tag" "$deb" --repo "$GITHUB_REPOSITORY" --clobber
