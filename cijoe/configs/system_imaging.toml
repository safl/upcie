# Shared system-imaging image definitions; pass alongside a guest config:
#
#   --config configs/<release>.toml --config configs/<mode>.toml \
#   --config configs/system_imaging.toml
#
# The disk image is staged by system_imaging.diskimage_from_oras from the
# release config's oras.url into disk.path, where qemu.guest_initialize picks it
# up.
[system-imaging.images.nosi-x86_64]
system_label = "x86_64"

cloud.metadata_path = "{{ resources.auxiliary['system_imaging.cloudinit-linux-common-metadata'] }}"
cloud.userdata_path = "{{ resources.auxiliary['system_imaging.cloudinit-linux-common-userdata'] }}"

disk.path = "{{ local.env.HOME }}/system_imaging/disk/nosi-amd64.qcow2"
