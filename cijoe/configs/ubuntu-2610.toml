# uPCIe cijoe configuration: Ubuntu 26.10 guest
#
# The release half of a guest config: which nosi image the QEMU guest boots.
# Pass it before an IOMMU mode, e.g.:
#
#   cijoe tasks/guest_setup.yaml \
#     --config configs/ubuntu-2610.toml \
#     --config configs/iommu_disabled.toml \
#     --config configs/system_imaging.toml
#
# nosi has no headless 26.10 image; ubuntu-2610-rocm is the stock 26.10 with
# ROCm and the RDMA userspace from the archive on top, none of which uPCIe uses.

[os]
name = "ubuntu"
version = "26.10"

# nosi guest image pulled by stage_nosi_guest into the system-imaging disk.path;
# the digest is the .img.gz layer's, ubuntu-2610-rocm:2026.W43
[guest_image]
url = "oras://ghcr.io/safl/nosi/ubuntu-2610-rocm@sha256:33a34476eee7f0ab9ced75c2c115c107e3f52bd5bd0084528b5079ac74019ad4"
