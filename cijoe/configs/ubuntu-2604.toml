# uPCIe cijoe configuration: Ubuntu 26.04 guest
#
# The release half of a guest config: which nosi image the QEMU guest boots.
# Pass it before an IOMMU mode, e.g.:
#
#   cijoe tasks/guest_setup.yaml \
#     --config configs/ubuntu-2604.toml \
#     --config configs/iommu_disabled.toml \
#     --config configs/system_imaging.toml \
#     --config rigs/upcie-nvme.toml

[os]
name = "ubuntu"
version = "26.04"

# The nosi guest image, staged by system_imaging.diskimage_from_oras into the
# system-imaging disk.path; the digest is the .img.gz layer's
[system-imaging.images.nosi-x86_64]
oras.url = "oras://ghcr.io/safl/nosi/ubuntu-2604-headless@sha256:ba8a8e478a067fa3f566dcb05559d83abf3c823b10d93c0b27fb896192d03628"
