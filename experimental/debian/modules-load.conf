# Both modules are misc devices with no hardware to match on, so nothing
# autoloads them the way a PCI alias or a udev rule would. The package exists
# to make the experimental paths usable, so it loads them.
#
# To stop that, mask this file:
#   ln -s /dev/null /etc/modules-load.d/upcie-experimental.conf
dmabuf_import
iommu_map_pa
